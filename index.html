<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Firdaus - Ubuntu Terminal Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal-window">
        <div class="terminal-header">
            <div class="buttons">
                <span class="close"></span>
                <span class="minimize"></span>
                <span class="maximize"></span>
            </div>
            <div class="title">visitor@ubuntu-portfolio: ~</div>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div class="welcome-text">
                <p>Welcome to Ubuntu 24.04 LTS (GNU/Linux 6.8.0-generic x86_64)</p>
                <p> * Documentation:  https://help.ubuntu.com</p>
                <p> * Management:     https://landscape.canonical.com</p>
                <p> * Support:        https://ubuntu.com/pro</p>
                <br>
                <p>Ketik <span class="highlight">help</span> untuk melihat daftar perintah yang tersedia.</p>
                <br>
            </div>
            <div id="output-area"></div>
            <div class="input-line">
                <span class="prompt">visitor@ubuntu:~$</span>
                <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
